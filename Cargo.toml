[package]
name = "grind-tui"
version = "0.1.0"
edition = "2024"
description = "LeetCode in your terminal: Grind 75 and NeetCode 150, offline, from a TUI"
license = "MIT"
repository = "https://github.com/vnctaing/grind-tui"
homepage = "https://github.com/vnctaing/grind-tui"
keywords = ["leetcode", "tui", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", ".omc"]

[[bin]]
name = "grind"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
unicode-width = "0.2"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: grind-tui-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: grind-tui-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: grind-tui-x86_64-unknown-linux-musl.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/grind grind
          tar czf ${{ matrix.archive }} grind
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.sha256
          generate_release_notes: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute checksums and update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ARM_SHA=$(cat grind-tui-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          X86_SHA=$(cat grind-tui-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          LINUX_SHA=$(cat grind-tui-x86_64-unknown-linux-musl.tar.gz.sha256 | awk '{print $1}')
          VERSION=${TAG#v}
          BASE="https://github.com/vnctaing/grind-tui/releases/download/${TAG}"

          cat > grind-tui.rb << EOF
          class GrindTui < Formula
            desc "LeetCode in your terminal — browse, run, and submit problems from a TUI"
            homepage "https://github.com/vnctaing/grind-tui"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/grind-tui-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "${BASE}/grind-tui-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_SHA}"
              end
            end

            on_linux do
              url "${BASE}/grind-tui-x86_64-unknown-linux-musl.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "grind"
            end

            test do
              assert_match "grind-tui", shell_output("#{bin}/grind --help")
            end
          end
          EOF

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/vnctaing/homebrew-tap.git
          mkdir -p homebrew-tap/Formula
          cp grind-tui.rb homebrew-tap/Formula/grind-tui.rb
          cd homebrew-tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/grind-tui.rb
          git commit -m "grind-tui ${TAG}"
          git push
